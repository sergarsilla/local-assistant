name: build

on:
  # Every branch: work branches get a real Android build before anyone opens a pull request.
  push:
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # Only the integration branches keep an APK, and only briefly: a 100 MB upload on every
      # push to every branch fills the account's artifact quota, and then no job can upload
      # anything at all, including the test reports that say why a run failed.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests, plus screenshot tests that render every screen under Robolectric.
      - name: Run unit and screenshot tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.record=true

      - name: Publish the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          retention-days: 7
